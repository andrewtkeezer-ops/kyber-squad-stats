<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kyber Squad Stats</title>
<meta name="description" content="Kyber Squad Stats — squad intelligence for Battlefront II on Kyber." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
  /* Layout: fixed command-rail on the left (crest, nav, faction switch, you); main column with a
     cinematic plate + holotable, stat strip, leaderboard. Live data from /api/data, demo otherwise. */
  :root{
    color-scheme:dark;box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    --font-b:"Manrope",system-ui,sans-serif;--font-m:"IBM Plex Mono",ui-monospace,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
    --bg:#07080c;--rail:#090a0f;--panel:#0f1118;--panel-2:#141722;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.16);
    --ink:#f2f4f8;--ink-2:#a9b0bf;--ink-3:#6b7384;
    --accent:#ff2d3f;--accent-glow:rgba(255,45,63,.45);--accent-soft:rgba(255,45,63,.12);--on-accent:#0a0608;
    --plate:url("plates/empire.jpg");
    --holo:#3ad7ff;--holo-2:#9be9ff;
    --c-teal:#2ef2d0;--c-blue:#39c9ff;--c-pink:#ff3d6e;--c-gold:#ffc53d;--c-violet:#b48cff;
    --light:#39c9ff;--dark:#ff3d6e;--rail-w:164px;
  }
  :root[data-faction="rebel"]{
    --bg:#090806;--rail:#0b0906;--panel:#131009;--panel-2:#1a150d;--line:rgba(255,200,140,.1);--line-2:rgba(255,200,140,.2);
    --accent:#ff9d2e;--accent-glow:rgba(255,157,46,.45);--accent-soft:rgba(255,157,46,.14);
    --plate:url("plates/rebel.jpg");
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-b);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100%;transition:background .6s}
  .mono{font-family:var(--font-m)}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- rail ---------- */
  .rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top,0px)) 0 calc(14px + env(safe-area-inset-bottom,0px));z-index:20}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 10px 26px}
  .crest{width:66px;height:66px;color:var(--accent);filter:drop-shadow(0 0 10px var(--accent-glow))}
  .brand b{font-family:var(--font-m);font-weight:600;letter-spacing:.3em;font-size:15px;line-height:1.5;text-align:center;padding-left:.3em}
  .brand b span{display:block;color:var(--accent)}
  .nav{display:flex;flex-direction:column}
  .nav button{display:flex;align-items:center;gap:10px;border:none;background:none;color:var(--ink-3);font:500 13.5px var(--font-b);padding:16px 14px;white-space:nowrap;cursor:pointer;text-align:left;border-left:3px solid transparent;transition:color .2s,background .2s}
  .nav button svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .nav button:hover{color:var(--ink-2)}
  .nav button.on{color:var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 80%);border-left-color:var(--accent)}
  .rail .sep{height:1px;background:var(--line);margin:26px 20px 18px}
  .fac{display:flex;flex-direction:column;gap:8px;padding:0 14px}
  .fac button{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:10px;background:none;color:var(--ink-2);font-family:var(--font-m);font-size:11px;letter-spacing:.14em;padding:11px 12px;cursor:pointer;transition:all .35s var(--ease)}
  .fac button svg{width:24px;height:24px;flex:none}
  .fac button.on{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600;box-shadow:0 0 18px var(--accent-glow)}
  .you{margin-top:auto;display:flex;align-items:center;gap:10px;padding:16px 14px 6px;border:none;background:none;color:var(--ink);cursor:pointer;text-align:left}
  .av{display:grid;place-items:center;border:1px solid var(--line-2);background:#161a24;font-family:var(--font-m);font-weight:600;flex:none}
  .you .av{width:36px;height:36px;border-radius:50%;font-size:12px}
  .you b{display:block;font-size:12.5px}.you small{display:block;font-family:var(--font-m);font-size:10px;color:var(--ink-3);letter-spacing:.06em;margin-top:3px}

  /* ---------- main ---------- */
  .main{margin-left:var(--rail-w);padding:14px 22px 48px;max-width:none}
  .topbar{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:18px 22px}
  .crumb{font-family:var(--font-m);font-size:12.5px;letter-spacing:.2em;color:var(--ink-2)}
  .crumb b{font-weight:500;color:var(--accent)}
  .topbar .r{margin-left:auto;display:flex;gap:10px;align-items:center}
  .ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:rgba(0,0,0,.45);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
  .ic svg{width:14px;height:14px;fill:currentColor}
  .ic.on{background:var(--accent);border-color:transparent;color:var(--on-accent)}
  .pill{font-family:var(--font-m);font-size:10.5px;letter-spacing:.14em;border:1px solid var(--line-2);border-radius:999px;padding:8px 13px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);white-space:nowrap}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
  .pill.live .dot{background:#49e6a4;box-shadow:0 0 8px rgba(73,230,164,.7)}
  .me{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px 4px 4px;background:rgba(0,0,0,.45);color:var(--ink);cursor:pointer;font-family:var(--font-m);font-size:11px}
  .me .av{width:30px;height:30px;border-radius:50%;font-size:10.5px}

  .hero{position:relative;aspect-ratio:1184/577;border-radius:14px;overflow:hidden;background:var(--plate) center/100% 100% no-repeat;isolation:isolate;border:1px solid var(--line)}
  .hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(7,8,12,.78) 0%,rgba(7,8,12,.35) 9%,rgba(7,8,12,0) 18%,rgba(7,8,12,0) 86%,rgba(7,8,12,.55) 100%),
               radial-gradient(ellipse 34% 26% at 19% 30%,rgba(7,8,12,.72) 0%,rgba(7,8,12,.5) 45%,rgba(7,8,12,0) 100%)}
  .copy{position:absolute;left:3%;top:16%;z-index:4;max-width:min(60%,600px)}
  .eyebrow{font-family:var(--font-m);color:var(--accent);font-size:12px;letter-spacing:.2em;text-shadow:0 0 12px var(--accent-glow)}
  h1{font-weight:700;font-size:clamp(32px,4.4vw,56px);line-height:1;margin:12px 0 10px;letter-spacing:-.015em;text-shadow:0 2px 24px rgba(0,0,0,.6)}
  .tag{font-family:var(--font-m);color:var(--ink-2);font-size:clamp(13px,1.5vw,19px);letter-spacing:.04em}
  .hint{position:absolute;left:36px;bottom:26px;z-index:4;display:flex;align-items:center;gap:12px;font-family:var(--font-m);font-size:12px;letter-spacing:.12em;color:var(--ink-2)}
  .hint svg{width:16px;height:22px;stroke:var(--ink-2);fill:none;stroke-width:1.4}
  .hint em{font-style:normal;color:var(--ink-3)}
  .wrapbtn{position:absolute;right:32px;bottom:26px;z-index:6;display:flex;align-items:center;gap:10px;font-family:var(--font-m);font-weight:600;font-size:12.5px;letter-spacing:.14em;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:12px 22px;background:rgba(0,0,0,.45);cursor:pointer;box-shadow:0 0 18px var(--accent-soft);transition:all .3s var(--ease)}
  .wrapbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
  .wrapbtn:hover{background:var(--accent);color:var(--on-accent);box-shadow:0 0 28px var(--accent-glow)}
  /* light: the painted table is the source; these overlays make it breathe */
  .lite{position:absolute;z-index:2;pointer-events:none;mix-blend-mode:screen;border-radius:50%}
  .lite.core{left:49.5%;top:64%;width:22%;aspect-ratio:2.4;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(190,240,255,.95) 0%,rgba(90,200,255,.55) 30%,rgba(40,140,255,.18) 60%,transparent 72%);filter:blur(10px);animation:corebreath 3.2s ease-in-out infinite}
  .lite.ring{left:49.5%;top:69%;width:66%;aspect-ratio:2.5;transform:translate(-50%,-50%);background:radial-gradient(ellipse,transparent 58%,rgba(70,190,255,.5) 64%,rgba(70,190,255,.22) 68%,transparent 74%);filter:blur(6px);animation:ringbreath 3.2s ease-in-out infinite}
  .lite.floor{left:49.5%;top:98%;width:80%;aspect-ratio:3.6;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(70,190,255,.38) 0%,rgba(70,190,255,.12) 45%,transparent 70%);filter:blur(14px);animation:corebreath 3.2s ease-in-out -1.1s infinite}
  .lite.sweep{left:49.5%;top:68%;width:64%;aspect-ratio:2.5;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,transparent 0deg,rgba(150,230,255,.0) 300deg,rgba(150,230,255,.55) 350deg,rgba(255,255,255,.75) 360deg);border-radius:50%;-webkit-mask:radial-gradient(ellipse,transparent 55%,#000 62%,#000 70%,transparent 76%);mask:radial-gradient(ellipse,transparent 55%,#000 62%,#000 70%,transparent 76%);filter:blur(2px);opacity:.8;animation:sweep 6s linear infinite}
  @keyframes corebreath{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes ringbreath{0%,100%{opacity:.35}50%{opacity:.9}}
  @keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .mark{position:absolute;z-index:5;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;border:0;background:none;padding:0;color:var(--ink);animation:bob 3.6s ease-in-out infinite}
  .mark .lbl{font-family:var(--font-m);font-size:clamp(9px,1.05vw,12.5px);font-weight:600;letter-spacing:.02em;color:#fff;background:rgba(6,8,14,.86);border:1.5px solid var(--c);border-radius:8px;padding:.45em 1em;white-space:nowrap;box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 12%,transparent)}
  .mark .tip{width:0;height:0;border:6px solid transparent;border-top-color:var(--c);margin-top:-1px;filter:drop-shadow(0 0 4px var(--c))}
  .mark.open .lbl{color:var(--ink-3);border-style:dashed;border-color:rgba(255,255,255,.35);box-shadow:none;background:rgba(6,8,14,.6)}
  .mark.open .tip{border-top-color:rgba(255,255,255,.35);filter:none}
  .glow{position:absolute;z-index:3;pointer-events:none;mix-blend-mode:screen;width:7%;aspect-ratio:.8;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,var(--c) 0%,color-mix(in srgb,var(--c) 55%,transparent) 35%,transparent 70%);filter:blur(8px);opacity:.55;animation:crystalglow 2.6s ease-in-out infinite}
  .glow.open{opacity:.12;animation:none}
  @keyframes crystalglow{50%{opacity:1}}
  @keyframes bob{50%{transform:translate(-50%,calc(-100% - 5px))}}
  .mark:hover .lbl{background:color-mix(in srgb,var(--c) 22%,rgba(6,8,14,.95));box-shadow:0 0 26px var(--c)}
  .empty-table{position:absolute;left:50%;bottom:40%;transform:translateX(-50%);z-index:5;font-family:var(--font-m);font-size:11px;letter-spacing:.2em;color:var(--holo-2);text-shadow:0 0 12px var(--holo);white-space:nowrap}

  /* ---------- strip ---------- */
  .strip{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 32px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .strip div{display:flex;align-items:center;gap:18px;padding:20px 24px;border-left:1px solid var(--line);min-width:0}
  .strip div:first-child{border-left:0}
  .strip svg{width:34px;height:34px;flex:none;stroke:var(--ink-3);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .strip b{display:block;font-size:clamp(20px,2.4vw,30px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
  .strip small{display:block;font-family:var(--font-m);color:var(--ink-2);font-size:12px;letter-spacing:.18em;margin-top:8px}

  /* ---------- views ---------- */
  .view{animation:rise .45s var(--ease) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .head{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 14px;gap:12px;flex-wrap:wrap}
  h2{font-size:30px;font-weight:700;margin:0;letter-spacing:-.01em}
  .head p{margin:6px 0 0;font-family:var(--font-m);color:var(--ink-2);font-size:15px}
  .sort{display:flex;align-items:center;gap:14px;font-family:var(--font-m);font-size:13px;color:var(--ink-2);padding-bottom:6px}
  .selwrap{position:relative}
  select.sel{appearance:none;-webkit-appearance:none;border:1px solid var(--line-2);border-radius:10px;padding:11px 38px 11px 16px;color:var(--ink);background:var(--panel);font:700 14px var(--font-b);cursor:pointer}
  .selwrap::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  table{width:100%;border-collapse:separate;border-spacing:0 10px;table-layout:fixed;margin-top:-4px}
  th{font-family:var(--font-m);font-weight:500;font-size:11.5px;letter-spacing:.18em;color:var(--ink-2);text-align:left;padding:6px 16px 0;background:var(--panel);border-top:1px solid var(--line)}
  th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
  thead tr th{padding-bottom:6px}
  th.r,td.r{text-align:right}
  td{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 16px;vertical-align:middle}
  td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
  tr.click{cursor:pointer}tr.click:hover td{background:var(--panel-2)}
  tr.top td{border-top-color:var(--accent);border-bottom-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
  tr.top td:first-child{background:linear-gradient(90deg,var(--accent-soft),color-mix(in srgb,var(--accent) 6%,var(--panel)))}
  tr.top td:first-child{border-left-color:var(--accent);border-left-width:2px}tr.top td:last-child{border-right-color:var(--accent)}
  .no{font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .pilot{display:flex;align-items:center;gap:14px;min-width:0}
  .pilot .av{width:46px;height:46px;border-radius:8px;font-size:15px}
  tr.top .av{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px var(--accent-soft)}
  .pilot b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pilot small{display:block;font-family:var(--font-m);font-size:12px;letter-spacing:.1em;color:var(--ink-2);margin-top:3px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--font-m);font-size:10.5px;border:1px solid var(--line-2);border-radius:999px;padding:5px 10px;display:inline-flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap;background:rgba(0,0,0,.25)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
  .chip i.d{background:var(--dark)}.chip i.l{background:var(--light)}.chip i.a{background:var(--accent)}.chip i.g{background:var(--c-gold)}
  .num{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .na{color:var(--ink-3);cursor:help;border-bottom:1px dotted var(--ink-3)}
  .muted{color:var(--ink-3)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
  .card h3{font-family:var(--font-m);font-weight:500;font-size:11px;letter-spacing:.22em;color:var(--ink-2);margin:0 0 14px;display:flex;align-items:center;gap:10px}
  .card h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .tile{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .tile b{display:block;font-size:clamp(20px,2.4vw,26px);font-weight:700;font-variant-numeric:tabular-nums}
  .tile b.a{color:var(--accent)}
  .tile small{display:block;font-family:var(--font-m);color:var(--ink-3);font-size:10.5px;letter-spacing:.18em;margin-top:5px}
  .barrow{display:grid;grid-template-columns:140px 1fr 150px;align-items:center;gap:12px;margin:9px 0}
  .barrow .n{font-size:13.5px;display:flex;align-items:center;gap:8px;min-width:0}.barrow .n i{width:7px;height:7px;border-radius:50%;flex:none}
  .barrow .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track{height:8px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}.track>i{display:block;height:100%;border-radius:6px;width:0;transition:width 1s var(--ease)}
  .barrow .v{text-align:right;font-family:var(--font-m);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .ph{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
  .ph .av{width:72px;height:72px;font-size:24px;border-radius:14px}
  .ph .side{font-family:var(--font-m);font-size:11px;letter-spacing:.22em}
  .vs-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:14px}
  .vs-pick select{width:100%;background:var(--bg);border:1px solid var(--line-2);color:var(--ink);padding:10px 12px;border-radius:10px;font:inherit;font-weight:700}
  .vs-x{font-family:var(--font-m);font-size:20px;color:var(--accent);letter-spacing:.1em}
  .vs-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:8px}
  .vs-head .p{display:flex;align-items:center;gap:10px;min-width:0}.vs-head .p.rr{flex-direction:row-reverse;text-align:right}
  .vs-head .av{width:44px;height:44px;border-radius:8px}
  .vs-head b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .verdict{text-align:center;font-family:var(--font-m);letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--ink-2)}
  .verdict b{color:var(--accent);font-size:14px;display:block;margin-bottom:2px}
  .vrow{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;gap:8px;margin:9px 0}
  .vrow .l2{text-align:center;font-family:var(--font-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .vbar{height:9px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
  .vbar>i{position:absolute;top:0;bottom:0;width:0;border-radius:6px;transition:width 1s var(--ease)}
  .vbar.l>i{right:0}.vbar.r>i{left:0}
  .vv{font-family:var(--font-m);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-3);margin-top:3px}.vv.win{color:var(--ink);font-weight:600}
  .tl{position:relative;padding-left:26px}.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .ev{position:relative;margin-bottom:14px}.ev::before{content:"";position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
  .ev .when{font-family:var(--font-m);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
  .ev .body{margin-top:4px;font-size:14px}
  .ev .stat{font-family:var(--font-m);font-size:11.5px;color:var(--ink-2);margin-top:3px}.ev .stat b{color:var(--ink)}
  .badge{font-family:var(--font-m);font-size:9.5px;letter-spacing:.16em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .srv{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:14px}

    const classes=(st.classes||[]).filter(x=>x.playtimeSec>0||x.kills>0).map(x=>({name:x.name,playtimeSec:x.playtimeSec||0,kills:x.kills||0,score:x.score||0,rank:x.rank||0})).sort((a,b)=>b.playtimeSec-a.playtimeSec);
    const lp=heroes.filter(h=>h.side==="light").reduce((a,h)=>a+h.playtimeSec,0),dp=heroes.filter(h=>h.side==="dark").reduce((a,h)=>a+h.playtimeSec,0);
    const career=c?{kills:c.kills,deaths:c.deaths,kd:c.kd,score:c.score,rank:c.rank,playtimeSec:c.playtimeSec||((st.totals?.heroPlaytimeSec||0)+(st.totals?.classPlaytimeSec||0)),killsAssists:c.killsAssists,winRate:c.winRate??null}
      :{kills:null,deaths:null,kd:null,score:null,rank:null,playtimeSec:(st.totals?.heroPlaytimeSec||0)+(st.totals?.classPlaytimeSec||0),killsAssists:null,winRate:null};
    const sessions=(p.sessions||[]).map(s=>{const d=s.decoded||{};const cc=d.career;return{start:s.start,end:s.end,durationMin:s.durationMin,
      career:cc?{kills:cc.kills,deaths:cc.deaths,kd:cc.kd}:null,
      classes:(d.classes||[]).filter(x=>x.playtimeSec>0).sort((a,b)=>b.playtimeSec-a.playtimeSec).slice(0,2).map(x=>({name:x.name,playtimeSec:x.playtimeSec,kills:x.kills||0})),

const dailyKills=(p,days=14)=>{const out=new Array(days).fill(0);(p.sessions||[]).forEach(s=>{const d=Math.floor((Date.now()-new Date(s.start))/86400e3);if(d>=0&&d<days)out[days-1-d]+=(s.career&&s.career.kills)||0;});return out;};

function sessionRows(evs){

    <div class="stat">${c?`<b>+${c.kills}</b> kills · <b>${c.deaths}</b> deaths · K/D <b>${c.kd}</b>`:"stats pending"}${hl?" · "+hl:""}</div></div>`;}).join("");

/* Sessions: records, heatmap, feed */
function renderSessions(){

  const all=base.flatMap(p=>(p.sessions||[]).map(s=>({p,s})));
  const evs=sessFilter==="all"?all:all.filter(e=>e.p.id===sessFilter);
  const grid=Array.from({length:7},()=>new Array(24).fill(0));
  all.forEach(({s})=>{const d=new Date(s.start);grid[(d.getDay()+6)%7][d.getHours()]++;});
  const byK=[...all].sort((a,b)=>(b.s.career?.kills||0)-(a.s.career?.kills||0))[0];
  const byL=[...all].sort((a,b)=>b.s.durationMin-a.s.durationMin)[0];
  const byKD=[...all].filter(e=>(e.s.career?.deaths||0)>=5).sort((a,b)=>(b.s.career.kd)-(a.s.career.kd))[0];
  const nights={};all.forEach(({s})=>{const k=new Date(s.start).toDateString();nights[k]=(nights[k]||0)+1;});const bigNight=Object.entries(nights).sort((a,b)=>b[1]-a[1])[0];
  const rec=(l,v,sub)=>`<div class="rec"><small>${l}</small><b>${v}</b><span>${sub}</span></div>`;
  app.innerHTML=`<div class="view">${UI.head("Sessions",`${all.length} recorded across the squad.`,UI.filters("sfilt",[["all","EVERYONE"],...base.map(p=>[p.id,p.name.toUpperCase()])],sessFilter))}
  ${UI.panel("SQUAD RECORDS",all.length?`<div class="records">${byK?rec("MOST KILLS IN A NIGHT",byK.s.career.kills,`${byK.p.name} · ${new Date(byK.s.start).toLocaleDateString([],{month:"short",day:"numeric"})}`):""}${byL?rec("LONGEST SESSION",byL.s.durationMin+"m",byL.p.name):""}${byKD?rec("SHARPEST NIGHT",byKD.s.career.kd+" K/D",`${byKD.p.name} · ${byKD.s.career.kills}/${byKD.s.career.deaths}`):""}${bigNight?rec("BIGGEST SQUAD NIGHT",bigNight[1]+" sessions",new Date(bigNight[0]).toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"})):""}</div>`:'<div class="muted">Records appear once sessions are recorded.</div>')}
  ${UI.panel("WHEN THE SQUAD PLAYS",all.length?UI.heat(grid):'<div class="muted">The heatmap fills in as the agent records sessions.</div>')}
  ${UI.panel("FEED",evs.length?`<div class="tl">${sessionRows(evs.slice(0,30))}</div>`:'<div class="muted">No sessions detected yet. A session appears when someone’s stats change on an official server while the agent is running — including nights you’re not on.</div>')}
  <div class="note">Sessions are reconstructed from stat snapshots (a burst of changes = one session). Kills/deaths per session come straight from the deltas.</div></div>`;
  UI.bind("sfilt",k=>{sessFilter=k;renderSessions();});
}

/* Rivalry */
function renderRivalry(){
  const list=sorted();if(list.length<2){app.innerHTML=UI.empty("Need at least two resolved pilots for a rivalry.");return;}
  rivA=list.find(p=>p.id===rivA)?rivA:list[0].id;rivB=list.find(p=>p.id===rivB&&p.id!==rivA)?rivB:list.find(p=>p.id!==rivA).id;
  const A=list.find(p=>p.id===rivA),B=list.find(p=>p.id===rivB),ca=A.career||{},cb=B.career||{};
  const top=p=>p.heroes[0]?.playtimeSec||p.classes[0]?.playtimeSec||0;
  const M=[["K/D",ca.kd,cb.kd,v=>v.toFixed(2)],["Win rate",ca.winRate,cb.winRate,pct],["Kills",ca.kills,cb.kills,fmtN],["Deaths (fewer wins)",ca.deaths,cb.deaths,fmtN,true],["Score",ca.score,cb.score,fmtN],["Level",ca.rank,cb.rank,String],["Play time",ca.playtimeSec,cb.playtimeSec,fmtH],["Main playtime",top(A),top(B),fmtH],["Kills this week",wkKills(A),wkKills(B),String],["Minutes this week",wkMin(A),wkMin(B),v=>v+"m"]];
  let wa=0,wb=0;
  const rows=M.map(([l,a,b,f,low])=>{const ok=a!=null&&b!=null;const mx=ok?Math.max(a,b,1e-9):1;let aw=false,bw=false;if(ok&&a!==b){aw=low?a<b:a>b;bw=!aw;}if(aw)wa++;if(bw)wb++;
    return `<div class="vrow"><div><div class="vbar l"><i data-w="${ok?Math.round(a/mx*100):0}" style="background:${sideCol(A.side)}"></i></div><div class="vv ${aw?'win':''}" style="text-align:right">${ok?f(a):na()}</div></div><div class="l2">${l}</div><div><div class="vbar r"><i data-w="${ok?Math.round(b/mx*100):0}" style="background:${sideCol(B.side)}"></i></div><div class="vv ${bw?'win':''}">${ok?f(b):na()}</div></div></div>`;}).join("");
  const opts=id=>list.map(p=>`<option value="${p.id}" ${p.id===id?"selected":""}>${p.name}</option>`).join("");
  const verdict=wa===wb?"Dead heat":`${(wa>wb?A:B).name} leads ${Math.max(wa,wb)}–${Math.min(wa,wb)}`;
  app.innerHTML=`<div class="view">${UI.head("Rivalry","Receipts, not vibes.",`<button class="ghost" id="settle">Copy verdict</button>`)}<div class="card"><div class="vs-pick"><select id="selA">${opts(rivA)}</select><span class="vs-x">VS</span><select id="selB">${opts(rivB)}</select></div>
  <div class="vs-head"><div class="p">${UI.avatar(A.name)}<b>${A.name}</b></div><div class="verdict">${wa===wb?"<b>Dead heat</b>":`<b>${(wa>wb?A:B).name}</b>leads ${Math.max(wa,wb)}–${Math.min(wa,wb)}`}</div><div class="p rr">${UI.avatar(B.name)}<b>${B.name}</b></div></div>${rows}
  <div class="note">Each row is a head-to-head on one stat; the verdict counts rows won.</div></div>
  <div class="grid2">${UI.panel(A.name.toUpperCase()+" · LAST 14 DAYS",UI.spark(dailyKills(A),sideCol(A.side),300,60))}${UI.panel(B.name.toUpperCase()+" · LAST 14 DAYS",UI.spark(dailyKills(B),sideCol(B.side),300,60))}</div></div>`;
  $("#selA").onchange=e=>{rivA=e.target.value;if(rivA===rivB)rivB=list.find(p=>p.id!==rivA).id;renderRivalry();};
  $("#selB").onchange=e=>{rivB=e.target.value;if(rivB===rivA)rivA=list.find(p=>p.id!==rivB).id;renderRivalry();};
  $("#settle").onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(`${A.name} vs ${B.name} — ${verdict} (Kyber Squad Stats)`).then(()=>{e.target.textContent="Copied ✓";});};
  UI.animate();
}

/* Live servers */
function renderServers(){
  if(!Array.isArray(servers)||!servers.length){app.innerHTML=UI.empty("Server list unavailable right now.");return;}
  const s=[...servers].sort((a,b)=>(b.official-a.official)||((b.players||0)-(a.players||0)));
  const pop=s.reduce((a,x)=>a+(x.players||0),0),offPop=s.filter(x=>x.official).reduce((a,x)=>a+(x.players||0),0);
  const shown=s.filter(x=>srvFilter==="all"?(x.players||0)>0||x.official:srvFilter==="official"?x.official:srvFilter==="hvv"?/HeroesVersus/.test(x.mode):(x.players||0)>0&&!x.official);
  const row=x=>`<div class="card srv"><div class="m"><b>${x.name}${x.official?'<span class="off">OFFICIAL · STATS COUNT</span>':""}${x.requiresPassword?' <span class="muted">🔒</span>':""}</b><small>${mapName(x.map)}${x.mode?" · "+modeName(x.mode):""}${x.mods&&x.mods.length?" · "+x.mods.slice(0,2).join(", ")+(x.mods.length>2?" +"+(x.mods.length-2):""):""}</small><div class="popbar"><i data-w="${Math.round((x.players||0)/(x.maxPlayers||1)*100)}"></i></div></div><div class="pop">${x.players||0} / ${x.maxPlayers||0}<br><span class="muted" style="font-size:10px">PLAYERS</span></div></div>`;
  app.innerHTML=`<div class="view">${UI.head("Live servers",`${s.length} online · ${pop} players right now${LIVE?" · refreshes every 90s":""}.`,UI.filters("srvf",[["all","POPULATED"],["official","OFFICIAL"],["hvv","HvV"],["community","COMMUNITY"]],srvFilter))}
  ${UI.tiles([UI.tile(pop,"PLAYERS ONLINE"),UI.tile(offPop,"ON OFFICIAL SERVERS"),UI.tile(s.filter(x=>x.official).length,"OFFICIAL SERVERS"),UI.tile(s.filter(x=>(x.players||0)>=(x.maxPlayers||1)*.9).length,"NEARLY FULL")])}
  ${shown.length?shown.map(row).join(""):'<div class="card muted">Nothing matches that filter right now.</div>'}
  <div class="note">Only OFFICIAL servers write to Kyber's stat system; community servers are great nights that don't show up here.</div></div>`;
  UI.bind("srvf",k=>{srvFilter=k;renderServers();});UI.animate();
}
function renderYou(){
  if(!LIVE){app.innerHTML=`<div class="view">${UI.head("Your profile")}<div class="card"><p class="muted" style="margin:0">In the live app you sign in with your Google account and claim your exact Kyber name here. The agent then tracks you automatically — including the nights you play without the squad.</p></div></div>`;return;}
  const claimed=ME&&ME.name;
  app.innerHTML=`<div class="view">${UI.head("Your profile")}<div class="card"><p class="muted" style="margin:0 0 12px">Signed in as <b style="color:var(--ink)">${ME&&ME.email||"(unknown — is Access on?)"}</b></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><input class="txt" id="kyberName" placeholder="your exact Kyber / in-game name" value="${claimed||""}" style="flex:1;min-width:220px"/><button class="btn" id="claim">${claimed?"Update my name":"Claim my name"}</button></div>
  <div class="note">${claimed?`You're tracked as <b style="color:var(--ink)">${claimed}</b>. The agent picks changes up within a few minutes.`:"Enter the exact name you use in Battlefront on Kyber. Stats only accrue on OFFICIAL servers."}</div></div></div>`;
  $("#claim").onclick=async()=>{const n=$("#kyberName").value.trim();if(!n)return;try{const r=await fetch("/api/claim",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:n})});if(!r.ok)throw new Error(await r.text());await load();renderYou();}catch(e){$("#kyberName").style.borderColor="var(--dark)";}};
}
$("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>switchTo(b.dataset.v));
$("#youBtn").onclick=()=>switchTo("you");$("#meBtn").onclick=()=>switchTo("you");
addEventListener("hashchange",()=>routeFromHash(false));
function routeFromHash(init){const h=location.hash.replace("#","");if(h==="rebel"||h==="empire")return;const [v,id]=h.split("/");if(id)selected=id;if(v&&VIEWS.includes(v)&&(init||v!==current))switchTo(v,false);}

/* ================= strip spotlight ================= */
(function(){
  $("#strip").addEventListener("pointermove",e=>{const d=e.target.closest(".strip>div");if(!d)return;const r=d.getBoundingClientRect();d.style.setProperty("--mx",(e.clientX-r.left)+"px");d.style.setProperty("--my",(e.clientY-r.top)+"px");});
  addEventListener("resize",moveInd);
})();

/* ================= weekly wrapped ================= */
function buildWrapped(){
  const list=players.filter(p=>p.resolved);
  const wk=list.map(p=>({p,min:wkMin(p),n:week(p).length,k:wkKills(p),d:wkDeaths(p),latest:Math.max(0,...week(p).map(s=>new Date(s.start).getHours()))}));
  const total=wk.reduce((a,x)=>a+x.min,0),totalK=wk.reduce((a,x)=>a+x.k,0),active=wk.filter(x=>x.n>0);
  const by=k=>[...wk].sort((a,b)=>b[k]-a[k])[0];
  const mvp=by("k"),grinder=by("n"),owl=by("latest"),ghost=wk.find(x=>x.n===0);
  const sharp=[...wk].filter(x=>x.k>=10&&x.d>0).sort((a,b)=>(b.k/b.d)-(a.k/a.d))[0];
  const feeder=[...wk].filter(x=>x.d>=10).sort((a,b)=>(a.k/Math.max(1,a.d))-(b.k/Math.max(1,b.d)))[0];
  const hc={};list.forEach(p=>week(p).forEach(s=>(s.heroes||[]).forEach(h=>{hc[h.name]=hc[h.name]||{side:h.side,sec:0};hc[h.name].sec+=h.playtimeSec;})));
  const hero=Object.entries(hc).sort((a,b)=>b[1].sec-a[1].sec)[0];
  return[
    {eyebrow:"SQUAD WRAPPED",title:"Your week in<br>the galaxy",sub:`${active.length} of ${list.length} pilots flew this week.`},
    {eyebrow:"SQUAD ELIMINATIONS",big:String(totalK),sub:`${totalK.toLocaleString()} kills across ${fmtH(total*60)} of official play.`},
    mvp&&mvp.k>0?{award:"MVP OF THE WEEK",title:mvp.p.name,sub:`${mvp.k} kills this week — the most of anyone.`}:null,
    sharp?{award:"SHARPSHOOTER",title:sharp.p.name,sub:`Best K/D of the week: ${(sharp.k/sharp.d).toFixed(2)}.`}:null,
    grinder&&grinder.n>1?{award:"THE GRINDER",title:grinder.p.name,sub:`${grinder.n} separate sessions. Relentless.`}:null,
    hero?{award:"HERO OF THE WEEK",title:hero[0],sub:`${fmtH(hero[1].sec)} of squad time.`,side:hero[1].side}:null,
    owl&&owl.latest>=22?{award:"NIGHT OWL",title:owl.p.name,sub:`Dropped in after ${owl.latest}:00. Sleep is for the Empire.`}:null,
    feeder&&feeder!==sharp?{award:"BIGGEST FEEDER",title:feeder.p.name,sub:`${(feeder.k/Math.max(1,feeder.d)).toFixed(2)} K/D this week. We still love you.`}:null,
    ghost?{award:"MISSING IN ACTION",title:ghost.p.name,sub:"Zero sessions this week. The squad noticed."}:null,
    {eyebrow:"SHARE CARD",card:[["Squad kills",totalK.toLocaleString()],["Squad time",fmtH(total*60)],["MVP",mvp&&mvp.k>0?mvp.p.name:"—"],["Hero of the week",hero?hero[0]:"—"],["Pilots active",`${active.length}/${list.length}`]]}
  ].filter(Boolean);
}
let W={slides:[],i:0,timer:null};
function openWrapped(){W.slides=buildWrapped();W.i=0;$("#wrapped").classList.add("open");blip();showSlide();}
function closeWrapped(){$("#wrapped").classList.remove("open");clearTimeout(W.timer);}
function showSlide(){
  const s=W.slides[W.i];if(!s){closeWrapped();return;}
  $("#wbars").innerHTML=W.slides.map((_,k)=>`<i class="${k<W.i?'done':k===W.i?'run':''}"></i>`).join("");
  let html="";
  if(s.card)html=`<div class="w-eyebrow">${s.eyebrow}</div><div class="w-card">${s.card.map(([k,v])=>`<div class="rw"><span>${k}</span><b>${v}</b></div>`).join("")}</div><button class="w-share" id="wshare">COPY RECAP</button>`;
  else if(s.big)html=`<div class="w-eyebrow">${s.eyebrow}</div><div class="w-big" id="wbig">0</div><div class="w-sub">${s.sub}</div>`;
  else if(s.award)html=`<div class="w-award">✦ ${s.award}</div><h2 class="w-title" ${s.side?`style="color:${sideCol(s.side)}"`:""}>${s.title}</h2><div class="w-sub">${s.sub}</div>`;
  else html=`<div class="w-eyebrow">${s.eyebrow}</div><h2 class="w-title">${s.title}</h2><div class="w-sub">${s.sub}</div>`;
  $("#wslide").innerHTML=`<div class="w-slide">${html}</div>`;
  if(s.big)countUp($("#wbig"),+s.big);
  const sh=$("#wshare");if(sh)sh.onclick=()=>{const txt="Kyber Squad Wrapped — "+s.card.map(([k,v])=>`${k}: ${v}`).join(" · ");navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>{sh.textContent="COPIED ✓";},()=>{sh.textContent=txt;});};
  clearTimeout(W.timer);if(!s.card)W.timer=setTimeout(()=>{W.i++;showSlide();},5000);
}
$("#openwrap").onclick=openWrapped;$("#wclose").onclick=closeWrapped;
$("#wnext").onclick=()=>{W.i++;showSlide();};$("#wprev").onclick=()=>{W.i=Math.max(0,W.i-1);showSlide();};
addEventListener("keydown",e=>{if(!$("#wrapped").classList.contains("open"))return;if(e.key==="Escape")closeWrapped();if(e.key==="ArrowRight")$("#wnext").click();if(e.key==="ArrowLeft")$("#wprev").click();});

/* ================= faction ================= */
function faction(f){FACTION=f;document.documentElement.setAttribute("data-faction",f);
  $("#crest").innerHTML=CREST[f];$("#bootcrest").innerHTML=CREST[f];$("#tEmp").innerHTML=CREST.empire;$("#tReb").innerHTML=CREST.rebel;
  $("#toggle").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.f===f));
  $("#crumb").textContent=f==="rebel"?"ALLIANCE COMMAND":"IMPERIAL COMMAND";
  $("#eyebrow").textContent=f==="rebel"?"ALLIANCE INTELLIGENCE NETWORK":"IMPERIAL COMMAND NETWORK";
  const n=players.filter(p=>p.resolved).length;
  $("#tag").textContent=(n?["Zero","One","Two","Three","Four","Five","Six"][Math.min(n,6)]+" pilot"+(n===1?"":"s")+". ":"")+(f==="rebel"?"One galaxy.":"One fleet.");
  try{localStorage.setItem("kss-faction",f);}catch{}
  hum(f);}
$("#toggle").addEventListener("click",e=>{const b=e.target.closest("button");if(b)faction(b.dataset.f);});

/* ================= boot ================= */
(async()=>{
  const msgs=["KYBER API","RESOLVING PILOTS","DECODING STAT KEYS","HOLOTABLE ONLINE"];let mi=0;const mt=setInterval(()=>{mi=(mi+1)%msgs.length;$("#bootmsg").textContent=msgs[mi];},450);
  let f="rebel";try{f=localStorage.getItem("kss-faction")||f;}catch{}
  if(location.hash==="#rebel")f="rebel";if(location.hash==="#empire")f="empire";
  await load();faction(f);renderMarks();renderStrip();render();routeFromHash(true);moveInd();
  clearInterval(mt);$("#bootmsg").textContent="HOLOTABLE ONLINE";setTimeout(()=>{$("#boot").classList.add("off");hum(FACTION);},reduce?0:650);
  if(LIVE)setInterval(async()=>{await load();renderMarks();renderStrip();if(current!=="you")render();},90000);
})();
</script>
