name: Build agent installer

# Builds the Windows installer and publishes it to GitHub Releases whenever the
# agent's version number changes on main (or when run by hand). The tray app
# updates itself from those releases.
on:
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v${{ steps.v.outputs.version }} already released"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.exists.outputs.skip == 'false'
        run: npm ci
      - name: Build and publish installer
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --publish always
